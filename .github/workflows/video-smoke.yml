name: video-smoke
# Runs the video pipeline (no Claude calls) on a real YouTube match from a
# GitHub runner and prints the report to the log. Edit video/smoke_target.txt
# to change the video: line 1 = URL, line 2 = optional extra CLI args.
on:
  push:
    paths: ["video/**", ".github/workflows/video-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests
      - name: Card names for matching (test input only, not committed)
        run: |
          curl -sSf https://api.tcgdex.net/v2/en/cards | python -c "import json,sys; print('\n'.join(sorted({c['name'] for c in json.load(sys.stdin)})))" > /tmp/cards.txt
          wc -l /tmp/cards.txt
      - name: Analyze
        run: |
          URL=$(sed -n 1p smoke_target.txt)
          ARGS=$(sed -n 2p smoke_target.txt)
          python -m ptcg_video chapters "$URL" || true
          python -m ptcg_video analyze "$URL" --no-llm --cards /tmp/cards.txt $ARGS
      - name: Print report
        if: always()
        run: |
          for f in out/*/report.md; do echo "=== $f"; head -c 60000 "$f"; done
          ls -la out/*/ out/*/source 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-smoke-out
          path: video/out/
          retention-days: 7
