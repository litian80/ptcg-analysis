name: snapshot
on:
  push:
    paths: ["tools/snapshot_urls.txt", ".github/workflows/snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapshot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -f raw
          git commit -m "snapshot raw pages [skip ci]" || exit 0
          git push
