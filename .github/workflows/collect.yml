name: collect

# Keeps data/ current: new sets and card pools, new major tournaments, and a check that the
# hand-curated rotation file is not out of date (opens an issue when it is).
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, after weekend events
  workflow_dispatch:
    inputs:
      max:
        description: "At most this many new tournaments in this run (blank = all)"
        required: false
      seasons:
        description: "Limitless season filters"
        required: false
        default: "2526,2627"

permissions:
  contents: write
  issues: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Cards and pools
        run: python -m ptcg cards

      - name: Tournaments
        env:
          PTCG_CACHE: ${{ runner.temp }}/http
        run: |
          python -m ptcg tournaments \
            --seasons "${{ inputs.seasons || '2526,2627' }}" \
            --max "${{ inputs.max || '1000' }}"

      - name: Deck selection numbers
        run: python -m ptcg.selection

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh cards and tournaments [skip ci]"
          git pull --rebase -X theirs  # on overlap, this run's fresher data wins
          git push

      - name: Rotation check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! out=$(python -m ptcg check); then
            title="Rotation file needs an update"
            if ! gh issue list --state open --search "$title in:title" --json number -q '.[].number' | grep -q .; then
              printf 'Update data/formats/standard_rotations.json:\n\n%s\n' "$out" | gh issue create --title "$title" --body-file -
            fi
          fi
