name: judgments
on:
  push:
    paths: ["ptcg/judgments.py", "tests/**", "data/judgments/**", "data/matchups/*.md", "data/archetypes/*.yaml",
            ".github/workflows/judgments.yml"]
  pull_request:
    paths: ["ptcg/judgments.py", "tests/**", "data/judgments/**", "data/matchups/*.md", "data/archetypes/*.yaml",
            ".github/workflows/judgments.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m ptcg.judgments check
