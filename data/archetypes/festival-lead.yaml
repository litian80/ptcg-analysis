slug: festival-lead
name: Festival Lead
name_zh: 祭典领头（丰蜜龙 + 猴子）
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 36 份卡表；卡牌效果取自 data/cards。打法是据此推断的，见 inferred。

summary: >-
  Festival Grounds 在场时，带 Festival Lead 特性的宝可梦（Dipplin、Goldeen、Seaking）一回合攻击两次，
  第一下击倒后第二下打对手新上来的宝可梦。主攻 Dipplin 的 Do the Wave 每只后备区宝可梦 20，
  后备区 5 只就是 100 ×2。Thwackey 在战斗场是 Festival Lead 宝可梦时，每只每回合可以从牌库找任意 1 张牌，
  3 只 Thwackey 就是 3 张。全是单奖，Rabsca 保护后备区不受招式伤害和效果。

setup:
  turn_1:
    - Buddy-Buddy Poffin 拿 Grookey + Applin（或 Goldeen、Rellor）。后备区要尽快铺满 5 只。
    - 打出 Festival Grounds（4 张）。
  turn_2:
    - Grookey 进化 Thwackey，Applin 进化 Dipplin；Dipplin 或 Seaking 在战斗场时每只 Thwackey 找 1 张。
    - Rellor 进化 Rabsca，挡住 Phantom Dive 之类的后备区伤害。
    - Dipplin 攻击两次：Do the Wave 100 ×2。对 ex 用 Brave Bangle（+30）或 Kieran（+30）。
  turn_3:
    - 最后一张手牌是 Gladion's Final Battle 时打出：非规则宝可梦当回合 +80，Do the Wave 180 ×2。
    - Forest of Vitality（31% 卡表）让草宝可梦放下当回合就能进化。
  key_cards: [Applin, Dipplin, Grookey, Thwackey, Festival Grounds, Buddy-Buddy Poffin]

attackers:
  - card: Dipplin
    printing: TWM 18
    role: main
    prizes: 1
    attack: Do the Wave
    cost: Grass
    damage: 后备区每只 20（5 只 = 100），Festival Grounds 在场时打两次
    notes: 80 HP，弱火。
  - card: Seaking
    printing: PRE 21
    role: secondary
    prizes: 1
    attack: Rapid Draw
    cost: Colorless
    damage: 60 并抽 2，打两次就是 120 + 抽 4
  - card: Goldeen
    printing: TWM 44
    role: early
    prizes: 1
    attack: Whirlpool
    cost: Colorless ×2
    damage: 10，正面时弃对手战斗场 1 个能量；打两次

support:
  - card: Thwackey
    role: Boom Boom Groove，战斗场是 Festival Lead 宝可梦时每回合找任意 1 张
    prizes: 1
  - card: Grookey
    role: Thwackey 的进化前
    prizes: 1
  - card: Applin
    role: Dipplin 的进化前
    prizes: 1
  - card: Rabsca
    role: Spherical Shield，后备区不受对手招式的伤害和效果
    prizes: 1
  - card: Rellor
    role: Rabsca 的进化前
    prizes: 1
  - card: Shaymin
    role: 89% 卡表有；后备区无规则宝可梦不受招式伤害
    prizes: 1
  - card: Psyduck
    role: 36% 卡表有；Damp 关掉自爆类特性（Dusclops/Dusknoir 的 Cursed Blast）
    prizes: 1

prize_map:
  liability: 全是单奖，对手要击倒 6 次；但 Dipplin 80 HP 很好打，对手一回合只能拿 1 张。
  routes:
    - name: 对单奖卡组（一回合两次击倒）
      steps:
        - {turn: 2, take: 2, target: 战斗场 + 新上来的, how: 100 ×2，第一下击倒后第二下打新的战斗场宝可梦}
        - {turn: 3, take: 2, target: 同上, how: 同上}
        - {turn: 4, take: 2, target: 同上, how: 同上}
    - name: 对 2 奖 ex 卡组
      steps:
        - {turn: 2, take: 0, target: 战斗场的 ex, how: 130 ×2（Brave Bangle）= 260，打不倒 280 以上的 ex}
        - {turn: 3, take: 2, target: 战斗场的 ex, how: 补刀击倒，第二下打新上来的}
        - {turn: 4, take: 2, target: 下一只 ex, how: Gladion's Final Battle 180 + 30 = 210 ×2，可一回合击倒 320 HP}
        - {turn: 5, take: 2, target: 最后一只 ex, how: 收尾}

matchups:
  - vs: rockets-honchkrow
    win_rate: 0.827
    plan: 数据上最好的对局。
  - vs: crustle-dri
    win_rate: 0.78
    plan: Dipplin 不是 ex，Crustle 的特性挡不住。100 ×2 = 200 一回合击倒 Crustle（带 Growing Grass Energy 也只有 170）。
  - vs: n-zoroark
    win_rate: 0.766
    plan: Zoroark ex 弱草，Do the Wave 100 ×2 就是 200 ×2，一回合拿 2-4 张。
  - vs: dragapult-ex
    win_rate: 0.369
    plan: Rabsca 挡 Phantom Dive 的后备区指示物，Rabsca 本身被 Boss 拉出击倒后就失效，要保护它。
  - vs: dragapult-dusknoir
    win_rate: 0.285
    plan: 先上 Psyduck 关掉 Cursed Blast。
  - vs: mega-excadrill-ex
    win_rate: 0.263
    plan: Mega Excadrill ex 340 HP（Hero's Cape 后 440），Dipplin 两下都打不倒，单纯是伤害不够。

mistakes:
  - 后备区没铺满就攻击，Do the Wave 伤害不够。
  - Festival Grounds 被对手换掉后没有备用场地，只能打一次。
  - 战斗场不是 Festival Lead 宝可梦就用 Thwackey（特性不生效）。

inferred:
  - 对 ex 卡组的两回合击倒路线是按伤害计算推的。
  - Rabsca 挡住 Phantom Dive 指示物，是按 "Prevent all damage from and effects of attacks" 推断的。
