slug: ogerpon-meganium-hydrapple
name: Ogerpon Meganium Hydrapple
name_zh: 厄鬼椪 + 大竺葵 + 蜜集大蛇 ex
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 24 份卡表（Limitless 卡表里叫 "Hydrapple"）；卡牌效果取自 data/cards。打法是据此推断的，见 inferred。

summary: >-
  13 个基本草能量的能量堆叠卡组。Meganium 的 Wild Growth 让每个基本草能量当 2 个草能量用，
  Teal Mask Ogerpon ex（每回合特性贴草并抽 1）和 Hydrapple ex（每回合特性贴草并回 30）
  每回合额外贴能量。Myriad Leaf Shower 按双方战斗场能量数加伤害，Hydrapple ex 的 Syrup Storm
  按我方全场草能量加伤害。Forest of Vitality 让草宝可梦放下当回合就能进化，2 阶第 2 回合就能上场。

setup:
  turn_1:
    - 后备区放 Teal Mask Ogerpon ex、Chikorita、Applin；Celebi 的 Traverse Time 找 3 张草宝可梦或场地。
    - Teal Dance 贴草抽 1，手贴第 2 个。
  turn_2:
    - 打出 Forest of Vitality，把 Chikorita → Bayleef → Meganium、Applin → Dipplin → Hydrapple ex 一回合进化到底。
    - Meganium 在场后，Ogerpon 身上的每个草能量算 2 个，Myriad Leaf Shower 伤害翻倍增长。
  turn_3:
    - Hydrapple ex 每回合贴草回 30，用 Syrup Storm 或继续 Ogerpon 攻击。
    - 对手剩 2 张奖赏卡时 Briar：Ogerpon（太晶）击倒对手战斗场宝可梦时多拿 1 张。
  key_cards: [Teal Mask Ogerpon ex, Chikorita, Bayleef, Meganium, Forest of Vitality, Hydrapple ex]

attackers:
  - card: Teal Mask Ogerpon ex
    printing: TWM 25
    role: main
    prizes: 2
    attack: Myriad Leaf Shower
    cost: Grass ×3（Meganium 在场时 2 个基本草能量即可）
    damage: 30 + 双方战斗场每个能量 30
    notes: 210 HP，弱火。
  - card: Hydrapple ex
    printing: SCR 14
    role: main / tank
    prizes: 2
    attack: Syrup Storm
    cost: Colorless ×2
    damage: 30 + 我方全场每个草能量 30
    notes: 330 HP，弱火，撤退费 3。特性 Ripening Charge 每回合贴草回 30。
  - card: Tapu Bulu
    printing: SFA 6
    role: non-ex attacker
    prizes: 1
    attack: Wood Hammer
    cost: Grass ×2 + Colorless ×2
    damage: 220，自伤 30
    notes: 单奖攻击手，打 Crustle（挡 ex 伤害）用。

support:
  - card: Meganium
    role: Wild Growth，基本草能量各当 2 个；被击倒后伤害骤降，是对手首要目标
    prizes: 1
  - card: Chikorita
    role: Meganium 的进化前
    prizes: 1
  - card: Bayleef
    role: Meganium 的 1 阶
    prizes: 1
  - card: Applin
    role: Hydrapple 的进化前
    prizes: 1
  - card: Dipplin
    role: Hydrapple 的 1 阶（这里不用 Festival Lead）
    prizes: 1
  - card: Celebi
    role: Traverse Time 找草宝可梦和场地
    prizes: 1
  - card: Meowth ex
    role: 每份卡表 2 张；上场找支援者
    prizes: 2
  - card: Fezandipiti ex
    role: 被击倒后抽 3
    prizes: 2

prize_map:
  liability: >-
    Ogerpon ex ×4、Hydrapple ex、Meowth ex、Fezandipiti ex 都是 2 奖；Meganium 只给 1 张但它倒了伤害就掉。
    对手的路线通常是先 Boss Meganium，再连续击倒 Ogerpon ex。
  routes:
    - name: 默认
      steps:
        - {turn: 2, take: 2, target: 战斗场的 ex, how: Meganium 在场 + Ogerpon 4 个草能量 = 至少 8 个能量计数}
        - {turn: 3, take: 2, target: Boss's Orders 拉出的 ex, how: 同上}
        - {turn: 4, take: 2, target: 剩下的 ex, how: 同上}
    - name: 落后时（Briar 翻盘）
      steps:
        - {turn: 3, take: 2, target: 战斗场的 ex, how: 正常击倒}
        - {turn: 4, take: 1, target: 战斗场单奖, how: 正常击倒}
        - {turn: 5, take: 3, target: 战斗场的 ex, how: 对手剩 2 张时打 Briar，Ogerpon 击倒 ex 多拿 1 张}

matchups:
  - vs: dragapult-blaziken
    win_rate: 0.268
    plan: 全队弱火，Blaziken ex 的 200 打草就是 400。
  - vs: dragapult-dusknoir
    win_rate: 0.287
    plan: Phantom Dive 和 Cursed Blast 直接打后备区的 Chikorita/Bayleef/Meganium，引擎起不来。
  - vs: dragapult-ex
    win_rate: 0.317
    plan: 同上；先放 Bayleef 前不要在后备区摆多只 70 HP 以下的小怪。
  - vs: basic-box-m
    win_rate: 0.692
    plan: Hydrapple ex 每回合回 30，对手 Kangaskhan 打不穿；对手的大量能量让 Myriad Leaf Shower 伤害更高。
  - vs: dhelmise-pbl
    win_rate: 0.695
    plan: Dhelmise 170 打不动 330 HP 的 Hydrapple ex。
  - vs: n-zoroark
    win_rate: 0.616
    plan: Zoroark ex 弱草。

evidence:
  - source: video-reviews/baltimore-2026-top-cut.md（项目共享文件夹）
    game: Baltimore 区域赛（2026-09-19）决赛，Dobberstein（本卡组）1-2 Kasturi（Basic Box）
    window: TEF-PBL
    confirms:
      - Forest of Vitality 让 Hydrapple ex 第 2 回合直接上场
      - 对手 Raging Bolt ex 弃 5 个能量一击 Hydrapple ex（https://www.youtube.com/watch?v=yCYfZA3AOxQ&t=1651s）
    adds:
      - 单奖诱饵加 Unfair Stamp：把 Tapu Bulu 或 Celebi 放到战斗场让对手击倒，下回合用 Ciphermaniac's 叠好的 Stamp 把对手手牌打到 2 张。Basic Box 没有抽牌支援者，场上没有 Fezandipiti ex 或 Kangaskhan 时抽不回来，第 1 局对手因此投降
      - Hydrapple ex 的资源上限：只有 2 张 Night Stretcher，Lana's Aid 拿不回 ex。第 2 局两张都用掉后，再也做不出 Hydrapple ex
      - 对手挂 Hero's Cape 的 Mega Kangaskhan ex（400）挡得住 Teal Mask 的 300，再用 Rapid-Fire Combo 三次正面 350 击倒 Hydrapple ex（https://www.youtube.com/watch?v=yCYfZA3AOxQ&t=3388s）
      - 对手的 Teal Mask Ogerpon ex 也算我方战斗场的能量：Teal Mask 身上堆着 8 个能量时，对手只要 3 个能量就能反杀（第 2 局）
    caveat: 一场；两局最后一击的面板没更新，按解说补上；第 3 局两处疑问操作的评价来自解说。
  - source: video-reviews/baltimore-2026-top-cut.md（项目共享文件夹）
    game: Baltimore 区域赛（2026-09-19）四强，Dobberstein（本卡组）2-0 Dreitzler（Slowking）
    window: TEF-PBL
    confirms:
      - Forest of Vitality 让 Meganium 和 Hydrapple ex 在第 2 回合同时上场（https://www.youtube.com/watch?v=nLkFmtXdXGE&t=21300s）
    adds:
      - Hydrapple ex 在场时，没有 Meganium 也能靠 Ripening Charge 和 Teal Dance 一击（第 2 局）
      - 对手 Slowking 复制 Metallic Hammer 300，加 Brave Bangle 30，一击满血 Hydrapple ex（https://www.youtube.com/watch?v=nLkFmtXdXGE&t=22446s）
    caveat: 两局都是对手卡手（第 2 局对手两张 Poké Pad 在奖赏卡里），不代表胜率。
  - source: video-reviews/indianapolis-2026.md（项目共享文件夹）
    game: Indianapolis 2026 区域赛第 2 天第 13 轮，Hope（本卡组，最终第 10：Celebi、Briar、Unfair Stamp、14 个基本草能量）2-0 Zheng（Dragapult ex，带 Moltres）
    window: TEF-POR
    confirms:
      - Meganium 在场时 6 个基本草能量算 12 个，Syrup Storm 打出 390（https://www.youtube.com/watch?v=6Nl_UgEEXM8&t=10500s），解说也这样算
      - 对手剩 2 张时打 Briar，Teal Mask Ogerpon ex 击倒战斗场多拿 1 张，收尾（https://www.youtube.com/watch?v=6Nl_UgEEXM8&t=12450s）
    adds:
      - 对 Dragapult：Celebi 的 Traverse Time 是招式，被 Budew 锁物品时照样找齐进化线（https://www.youtube.com/watch?v=6Nl_UgEEXM8&t=11310s）
      - 对 Dragapult：对手用 Moltres 收掉 Teal Mask Ogerpon ex 后，下一回合打 Unfair Stamp（第 1 局）
      - Meganium 被收掉后用 Night Stretcher 拿回来（第 1 局）
    caveat: 一场两局；第 1 局对手开局没锁物品，两张 Crushing Hammer 都是反面。

mistakes:
  - 没打出 Forest of Vitality 就在第 2 回合试图上 2 阶。
  - Meganium 在后备区没有保护，被 Boss 击倒后伤害不足。
  - 对手剩 2 张时手里有 Briar 却用别的支援者。

inferred:
  - "Wild Growth 让每个基本草能量在 Myriad Leaf Shower / Syrup Storm 的计数里算 2 个，按卡牌文字\"provides GrassGrass Energy\"推断；Indianapolis 2026 的录像里解说也这样算 Syrup Storm（见 evidence），还没找到正式裁定。"
  - Briar 翻盘路线按卡牌文字推断。
