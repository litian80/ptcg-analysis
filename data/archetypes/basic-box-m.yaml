slug: basic-box-m
name: Basic Box
name_zh: 基础宝可梦盒子（Mega 袋兽 ex）
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 52 份卡表；卡牌效果取自 data/cards。打法是据此推断的，见 inferred。

summary: >-
  全是基础宝可梦，第 1 回合就能摆好攻击手。Teal Mask Ogerpon ex 用特性贴草能量并抽 1，
  Crispin 和 4 张 Energy Switch 把能量挪给当回合要打的人。主攻手按对手换：
  Mega Kangaskhan ex（Rapid-Fire Combo 200 起）、Latias ex（Eon Blade 200）、Iron Leaves ex（Prism Edge 180）、
  Raging Bolt ex（弃几个能量打几个 70）。Lillie's Clefairy ex 让对手所有龙属性弱超能，专门对付 Dragapult。
  Area Zero Underdepths 在有太晶宝可梦时后备区扩到 8 格。

setup:
  turn_1:
    - 战斗场放 Latias ex（Skyliner：我方基础宝可梦撤退费 0），后备区放 Teal Mask Ogerpon ex。
    - Teal Dance 贴草能量抽 1，手贴第 2 个能量；Crispin 找两种不同的基本能量。
    - 打出 Area Zero Underdepths，把后备区扩到 8 格。
  turn_2:
    - 按对手选主攻：对龙用 Lillie's Clefairy ex 开 Fairy Zone 后 Latias ex 打 400；对单奖用 Raging Bolt ex 或 Iron Leaves ex。
    - Glass Trumpet（有太晶宝可梦在场时）从弃牌区给后备区两只无色宝可梦各贴 1 个能量，给 Mega Kangaskhan ex 充能。
    - Iron Leaves ex 从手上放到后备区时可以换到战斗场并把其他宝可梦的能量全挪过来。
  turn_3:
    - Mega Kangaskhan ex 在战斗场时 Run Errand 每回合抽 2。
  key_cards: [Teal Mask Ogerpon ex, Latias ex, Mega Kangaskhan ex, Crispin, Energy Switch, Area Zero Underdepths]

attackers:
  - card: Mega Kangaskhan ex
    printing: MEG 104
    role: main
    prizes: 3
    attack: Rapid-Fire Combo
    cost: Colorless ×3
    damage: 200，之后每次正面 +50（抛到反面为止）
    notes: 300 HP，基础 Mega，被击倒给 3 张。Team Rocket's Watchtower 在场时 Run Errand 无效（无色）。
  - card: Latias ex
    printing: SSP 76
    role: main vs Dragon
    prizes: 2
    attack: Eon Blade
    cost: Psychic ×2 + Colorless
    damage: 200，下回合不能攻击；配合 Fairy Zone 打龙属性为 400
  - card: Teal Mask Ogerpon ex
    printing: TWM 25
    role: engine / attacker
    prizes: 2
    attack: Myriad Leaf Shower
    cost: Grass ×3
    damage: 30 + 双方战斗场每个能量 30
  - card: Iron Leaves ex
    printing: TEF 25
    role: attacker
    prizes: 2
    attack: Prism Edge
    cost: Grass ×2 + Colorless
    damage: 180，下回合不能攻击
  - card: Raging Bolt ex
    printing: TEF 123
    role: attacker
    prizes: 2
    attack: Bellowing Thunder
    cost: Lightning + Fighting
    damage: 弃掉我方场上任意个基本能量，每个 70
    notes: 83% 卡表有。打完能量少了，靠 Ogerpon 和 Crispin 补。
  - card: Wellspring Mask Ogerpon ex
    printing: TWM 64
    role: sniper
    prizes: 2
    attack: Torrential Pump
    cost: Water + Colorless ×2
    damage: 100，可再把 3 个能量洗回牌库对后备区 120

support:
  - card: Lillie's Clefairy ex
    role: Fairy Zone 让对手龙属性弱超能（Dragapult ex、N's Zekrom/Reshiram、Raging Bolt ex）
    prizes: 2
  - card: Meowth ex
    role: 每份卡表 3 张；上场找支援者
    prizes: 2
  - card: Fezandipiti ex
    role: 被击倒后抽 3
    prizes: 2
  - card: Chien-Pao
    role: 上场时破坏场地（例如对手的 Battle Cage、Festival Grounds），1 奖
    prizes: 1
  - card: Enamorus
    role: 56% 卡表有；与对手有同属性宝可梦时 200，非 ex，用来打 Crustle
    prizes: 1

prize_map:
  liability: >-
    几乎全是 2 奖 ex，Mega Kangaskhan ex 给 3 张。对手击倒 3 只 2 奖 ex 就赢，
    或 Kangaskhan + 2 奖 + 1 奖。所以先用 2 奖的攻击手换，Kangaskhan 在对手难以一击 300 时再上。
    后备区 8 格是双刃剑：Phantom Dive 和 Boss 的靶子也多。
  routes:
    - name: 默认（每回合一击 2 奖 ex）
      steps:
        - {turn: 2, take: 2, target: 战斗场的 ex, how: 按属性选攻击手一击击倒}
        - {turn: 3, take: 2, target: Boss's Orders 拉出的 ex, how: Energy Switch 把能量挪给下一个攻击手}
        - {turn: 4, take: 2, target: 最后一只 ex, how: Prime Catcher（42% 卡表）或 Boss 收尾}
    - name: 对 Dragapult
      steps:
        - {turn: 2, take: 2, target: 进化中的 Drakloak/Dreepy 或 Fezandipiti ex, how: 先压对手展开}
        - {turn: 3, take: 2, target: Dragapult ex, how: Lillie's Clefairy ex 在场，Latias ex 的 Eon Blade 200 ×2 = 400}
        - {turn: 4, take: 2, target: 第二只 Dragapult ex, how: 另一个攻击手或 Clefairy 的 Full Moon Rondo（后备区越多越高，再 ×2）}

matchups:
  - vs: ogerpon-meganium-hydrapple
    win_rate: 0.277
    plan: 最差对局。对方 Hydrapple ex 每回合回 30，Meganium 让草能量翻倍伤害更高。用 Raging Bolt ex 一击 Hydrapple（330 HP 需要弃 5 个能量）。
  - vs: alakazam-dudunsparce
    win_rate: 0.435
    plan: 对方单奖，你送 2-3 张它拿 1 张。Wellspring Ogerpon 狙后备区 Abra/Kadabra，早点断进化。
  - vs: crustle-dri
    win_rate: 0.435
    plan: ex 打不了 Crustle。用 Enamorus（双方都有草属性时 200，够击倒带 Growing Grass Energy 的 170 HP Crustle）；Chien-Pao 只有 120，要两下。
  - vs: dragapult-ex
    win_rate: 0.506
    plan: 见上面"对 Dragapult"路线；Lillie's Clefairy ex 是关键，对手会优先 Boss 它。
  - vs: sharpedo-toxtricity
    win_rate: 0.742
    plan: 数据上最好的对局之一。
  - vs: cynthia-garchomp-ex
    win_rate: 0.713
    plan: 数据上占优；Garchomp 是斗属性，不吃 Fairy Zone，优势原因没有从卡表推出。

mistakes:
  - 第一回合就把 Mega Kangaskhan ex 摆进战斗场，被对手先击倒送 3 张。
  - 对 Dragapult 时 Lillie's Clefairy ex 放出来后没保护，被 Boss 击倒后失去弱点。
  - Raging Bolt ex 把能量弃光，下回合没人能攻击。

inferred:
  - 对 Hydrapple 的处理和对 Crustle 用 Enamorus 都是按卡牌文字推断的。
  - Mega Kangaskhan ex 的出场时机是按奖赏卡数推断的。
