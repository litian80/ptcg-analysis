slug: mega-excadrill-ex
name: Mega Excadrill
name_zh: Mega 龙头地鼠 ex
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 24 份卡表；卡牌效果取自 data/cards。打法是据此推断的，见 inferred。

summary: >-
  Drilbur 进化 Mega Excadrill ex（340 HP），Maximum Drilling 3 个钢能量打 200，再多 2 个能量打 330，
  几乎一击任何宝可梦。能量靠 Metang 的 Metal Maker（看牌库顶 4 张，钢能量全贴上），卡组带 16 个钢能量。
  Genesect ex 每回合检索 2 只钢属性进化宝可梦。Team Rocket's Petrel 能找任何训练家卡。
  弱点是 Mega 被击倒给 3 张，两只 Mega 倒下就输。

setup:
  turn_1:
    - Buddy-Buddy Poffin 拿 Drilbur + Beldum（都是 70 HP），后备区再放 Genesect ex。
    - Drilbur 在战斗场时可以用 Call for Family（1 个无色）从牌库拿 2 只基础宝可梦到后备区。
    - 手贴钢能量给 Drilbur。
  turn_2:
    - Genesect ex 的 Metallic Signal 拿 Metang + Mega Excadrill ex。
    - Beldum 进化 Metang，Metal Maker 给 Excadrill 贴能量；两只 Metang 一回合可贴 2-4 个。
    - 进化 Mega Excadrill ex，凑到 3 个先打 200；凑到 5 个打 330。
  turn_3:
    - 准备第二只 Excadrill（或 Mega Skarmory ex）在后备区充好能，前一只倒下立刻接上。
    - Jumbo Ice Cream（3 个以上能量时回 80）和 Hero's Cape（+100 HP，50% 卡表）让 Excadrill 撑过对手一击。
  key_cards: [Drilbur, Mega Excadrill ex, Beldum, Metang, Genesect ex, Team Rocket's Petrel]

attackers:
  - card: Mega Excadrill ex
    printing: PBL 65
    role: main
    prizes: 3
    attack: Maximum Drilling
    cost: Metal ×3
    damage: 200；身上额外再有 2 个能量（共 5 个）时 330
    notes: 340 HP，弱火，撤退费 4。Undermine（Metal ×2）90 + 磨对手牌库 2 张，能量不够时用。
  - card: Mega Skarmory ex
    printing: POR 55
    role: sniper
    prizes: 3
    attack: Sonic Ripper
    cost: Metal ×2 + Colorless
    damage: 对手任一宝可梦 220，自己的能量全部洗回牌库
    notes: 79% 卡表有。撤退费 0。也是 3 奖。
  - card: Metagross
    printing: CRI 61
    role: non-ex attacker
    prizes: 1
    attack: Metallic Hammer
    cost: Metal ×3 + Colorless
    damage: 150；弃 3 个钢能量时 300
    notes: 打 Crustle 的主力（Crustle 挡 ex 的伤害）。Bounce Back（1 钢）60 并把对手战斗场换下。
  - card: Genesect ex
    printing: BLK 67
    role: engine / attacker
    prizes: 2
    attack: Protect Charge
    cost: Metal ×2 + Colorless
    damage: 150，下回合受到伤害 -30

support:
  - card: Drilbur
    role: Excadrill 的进化前；Call for Family 铺场
    prizes: 1
  - card: Beldum
    role: Metang 的进化前
    prizes: 1
  - card: Metang
    role: Metal Maker 加速能量，这套牌的引擎
    prizes: 1
  - card: Empoleon ex
    role: 38% 卡表有；Emperor's Stance 不受招式效果影响，Iron Feathers 210
    prizes: 2
  - card: Fezandipiti ex
    role: 54% 卡表有；被击倒后抽 3
    prizes: 2

prize_map:
  liability: >-
    Mega Excadrill ex 和 Mega Skarmory ex 各 3 张，两只倒下对手就拿满 6 张。Genesect ex 2 张。
    所以每只 Mega 都要尽量让对手两下才打倒（Hero's Cape、Jumbo Ice Cream），并且换人前先打出伤害。
    对手的 1 奖小怪换你的 3 奖是这套牌最怕的交换。
  routes:
    - name: 默认（每回合一击）
      steps:
        - {turn: 2, take: 2, target: 战斗场的 ex, how: 200（3 能量）或 330（5 能量）}
        - {turn: 3, take: 2, target: Boss's Orders 拉出的 ex, how: Metal Maker 继续补能量}
        - {turn: 4, take: 2, target: 剩下的 ex, how: Mega Skarmory ex 的 Sonic Ripper 也可以直接打后备区 220}
    - name: 对 Mega 卡组（如 Basic Box 的 Mega Kangaskhan ex）
      steps:
        - {turn: 2, take: 3, target: Mega Kangaskhan ex, how: 330 一击 300 HP}
        - {turn: 3, take: 3, target: 第二只 Mega 或 2 奖 + 1 奖, how: 同上}

matchups:
  - vs: mega-lucario-ex
    win_rate: 0.167
    plan: 数据上最差，原因没有从卡表推出。
  - vs: alakazam-dudunsparce
    win_rate: 0.192
    plan: 对手全是单奖，Excadrill 的 330 浪费；对手 Powerful Hand 放指示物，不吃 Protect Charge 减伤，Excadrill 3 奖。
  - vs: rockets-honchkrow
    win_rate: 0.216
    plan: 数据上很差，原因没有从卡表推出。
  - vs: dragapult-blaziken
    win_rate: 0.253
    plan: Excadrill 弱火，对手 Blaziken ex 的 Smolder-sault 200 ×2 = 400 一击。Hero's Cape（440 HP）也不够，尽量换 Skarmory 或 Genesect ex 接招。
  - vs: crustle-dri
    win_rate: 0.695
    plan: Crustle 挡 ex 的伤害，用 Metagross（非 ex）弃 3 个能量打 300。
  - vs: festival-lead
    win_rate: 0.667
    plan: 对手 Dipplin 80 HP 打不动 340 HP 的 Excadrill。

mistakes:
  - 两只 Mega 同时摆在场上，被对手连续击倒送 6 张。
  - Excadrill 只有 3 个能量就攻击，打出 200 而不是 330，没拿到击倒。
  - Metal Maker 没在进化 Excadrill 之前用，能量贴不到要攻击的宝可梦。

inferred:
  - 对 Mega Lucario、Honchkrow 劣势的原因没有推出。
  - 用 Hero's Cape / Jumbo Ice Cream 让对手两下的打法是按奖赏卡数推断的。
