slug: crustle-dri
name: Crustle
name_zh: 岩殿居蟹（防 ex 墙）
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 18 份卡表；卡牌效果取自 data/cards。打法是据此推断的，见 inferred。

summary: >-
  Crustle（DRI 12）的 Mysterious Rock Inn 让对手宝可梦 ex 的招式伤害全部无效。
  对只靠 ex 攻击的卡组，它就是一堵墙：每回合 Superb Scissors 120，慢慢磨。
  Mist Energy 让 Crustle 不受招式效果，Spiky Energy 反伤 20，Growing Grass Energy +20 HP，
  Jumbo Ice Cream、Pokémon Center Lady 回血。Eri 和 Xerosic's Machinations 打乱对手手牌。
  Mega Kangaskhan ex ×4 用来抽牌和打非 ex 对手，但它给 3 张。

setup:
  turn_1:
    - 后备区放 Dwebble ×2-3（Buddy-Buddy Poffin，或 Lumiose City 找基础宝可梦，但用了会结束回合）。
    - Dwebble 在战斗场时 Ascension（1 个无色）从牌库直接进化成 Crustle。
  turn_2:
    - 战斗场 Crustle 贴 Mist Energy / Spiky Energy；Team Rocket's Petrel 找任意训练家卡。
    - Eri 弃对手 2 张物品，或 Xerosic's Machinations 让对手弃到 3 张手牌。
  turn_3:
    - Superb Scissors（Grass + 2 无色）120，伤害不受对手战斗场宝可梦身上效果影响。
    - Hero's Cape 给 Crustle +100 HP（250，加 Growing Grass 270）。
  key_cards: [Dwebble, Crustle, Mist Energy, Team Rocket's Petrel, Jumbo Ice Cream, Eri]

attackers:
  - card: Crustle
    printing: DRI 12
    role: main / wall
    prizes: 1
    attack: Superb Scissors
    cost: Grass + Colorless ×2
    damage: 120，不受对手战斗场宝可梦身上效果影响
    notes: 150 HP，弱火，撤退费 3。特性只挡 ex 的招式伤害，不挡指示物放置，也不挡非 ex。
  - card: Mega Kangaskhan ex
    printing: MEG 104
    role: secondary / draw
    prizes: 3
    attack: Rapid-Fire Combo
    cost: Colorless ×3
    damage: 200 起，每次正面 +50
    notes: 战斗场时 Run Errand 抽 2。对非 ex 卡组时的主要输出，但被击倒给 3 张。

support:
  - card: Dwebble
    role: Ascension 从牌库直接进化
    prizes: 1

prize_map:
  liability: >-
    Crustle 单奖。真正的风险是 Mega Kangaskhan ex（3 张）：对 ex 卡组时尽量不让它站在战斗场被打。
    对手的非 ex 攻击手（Moltres、Munkidori、Dhelmise、Dipplin、Dusknoir 的 Cursed Blast）是这套牌的威胁。Alakazam 的 Powerful Hand 是招式效果，会被 Mist Energy 挡住。
  routes:
    - name: 对只有 ex 攻击手的卡组（默认）
      steps:
        - {turn: 3, take: 0, target: 战斗场 ex, how: 120}
        - {turn: 4, take: 2, target: 同一只 ex, how: 再 120（240 击倒 210-240 HP 的 ex）}
        - {turn: 5, take: 0, target: 下一只 ex, how: 120}
        - {turn: 6, take: 2, target: 同上, how: 120}
        - {turn: 7, take: 2, target: Boss's Orders 拉出的残血 ex, how: 收尾；对手拿不到奖赏卡，慢一点没关系}
    - name: 对非 ex 卡组
      steps:
        - {turn: 3, take: 1, target: 战斗场, how: Crustle 120 或 Kangaskhan 200+}
        - {turn: 4, take: 1, target: 战斗场, how: 同上}
        - {turn: 5, take: 1, target: 战斗场, how: 同上}
        - {turn: 6, take: 1, target: 战斗场, how: 同上}
        - {turn: 7, take: 1, target: 战斗场, how: 同上}
        - {turn: 8, take: 1, target: 战斗场, how: 拼续航，通常劣势}

matchups:
  - vs: lopunny-dudunsparce
    win_rate: 0.167
    plan: 数据上最差，原因没有从卡表推出。
  - vs: festival-lead
    win_rate: 0.18
    plan: Dipplin 不是 ex，100 ×2 一回合击倒 Crustle。
  - vs: slowking-scr
    win_rate: 0.208
    plan: Slowking 不是 ex，复制来的 Metallic Hammer 300（官方裁定，不用弃钢能量）一击任何 Crustle。
  - vs: mega-excadrill-ex
    win_rate: 0.27
    plan: 对手 Metagross（非 ex）弃 3 能量打 300。
  - vs: dragapult-blaziken
    win_rate: 0.744
    plan: 对手两个主攻都是 ex。注意 Munkidori 挪指示物和 Phantom Dive 的后备区指示物（Mist Energy 挡住后者）。
  - vs: dragapult-ex
    win_rate: 0.677
    plan: 同上；对手的 Moltres（非 ex，火属性）打 20，Crustle 弱火所以是 40。

evidence:
  - source: video-reviews/indianapolis-2026.md（项目共享文件夹）
    game: Indianapolis 2026 区域赛八强，Reddy（本卡组，4 张 Crushing Hammer，场地只有 1 张 Team Rocket's Factory）2-0 Sakadjian（Dragapult ex，2 张 Watchtower）
    window: TEF-POR
    confirms:
      - 对 Dragapult：ex 打不动 Crustle，对手只能靠 Crushing Hammer 和 Munkidori，Jumbo Ice Cream 回得更快
      - 对 Dragapult：后备区没贴 Mist 的 Crustle 吃 Phantom Dive 的指示物（第 2 局）
    adds:
      - 对 Dragapult：Hero's Cape 挂 Crustle，解说算过对手大约要 5 个回合才打得穿（第 1 局）
      - 对 Dragapult：战斗场的 Kangaskhan 贴 Spiky Energy，Budew 每次 Itchy Pollen 反吃 20（第 1 局）
      - 对 Dragapult：Eri 弃掉对手手里的 Unfair Stamp 和 Night Stretcher；放弃战斗场的 Crustle，把能量堆到后备区挂 Cape 的 Crustle 上（第 2 局）
      - 只带 1 张场地又在奖赏卡里时，对手的 Watchtower 一直关着 Run Errand（第 1 局）
    caveat: 一场两局；时间按解说；对手第 1 局 4 次 Crushing Hammer 都是反面（https://www.youtube.com/watch?v=rFR1ZVFc5ic）。
  - source: video-reviews/indianapolis-2026.md（项目共享文件夹）
    game: Indianapolis 2026 区域赛决赛，Reddy（本卡组）0-2 Jones（Alakazam Dudunsparce，Dedenne，2 张 Enhanced Hammer）
    window: TEF-POR
    confirms:
      - 对 Alakazam：Enhanced Hammer 决定这个对局；没贴 Mist 的 Kangaskhan 站战斗场被一击送 3 张（第 1 局）
    adds:
      - 对 Alakazam：Dedenne 每回合用 Electromagnetic Sonar 捡回 Enhanced Hammer，Sacred Ash 还能把它洗回牌库（第 1 局）
      - 对 Alakazam：挂 Hero's Cape 的 Kangaskhan 只是把门槛提到 20 张手牌，两局都被凑到
      - 对 Alakazam：两张 Mist 被一回合两张 Enhanced Hammer 弃掉（第 2 局）
    caveat: 一场两局；第 1 局 3 张 Growing Grass Energy 和 1 张 Mist 在奖赏卡里，卡表又没有基本 Grass Energy，草能量只剩 1 张（https://www.youtube.com/watch?v=nlj_HY9SoJo）。

mistakes:
  - 对 ex 卡组时让 Mega Kangaskhan ex 站在战斗场，被一击送 3 张。
  - Crustle 没贴 Mist Energy，被 Phantom Dive 的指示物慢慢磨掉。
  - 对手有非 ex 攻击手时仍然按"墙"的思路慢打。

inferred:
  - Mist Energy 挡住后备区的 Phantom Dive 指示物（招式效果），按卡牌文字推断。
  - Superb Scissors 无视"对手战斗场宝可梦身上的效果"是否包括特性，未核实。
