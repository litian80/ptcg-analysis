slug: dragapult-ex
name: Dragapult
name_zh: 多龙巴鲁托 ex
window: TEF-30C
basis: Frankfurt 与 Brisbane 区域赛（2026-09-26）的 126 份卡表；卡牌效果取自 data/cards 的卡牌数据。打法是据此推断的，见 inferred。

summary: >-
  第三回合进化出 Dragapult ex，用 Phantom Dive（200 + 后备区放 6 个伤害指示物）
  每回合同时打战斗场和后备区。Munkidori 每回合再挪 3 个指示物，靠"打一个、
  顺手收掉后备区小怪"拿多张奖赏卡。卡表里 4 张 Crushing Hammer、2 张 Risky Ruins
  和 Budew 的锁物品负责拖慢对手。

setup:
  turn_1:
    - Buddy-Buddy Poffin 拿 2 只 Dreepy（或 Dreepy + Budew），后备区至少 2 只 Dreepy。
    - 后攻时首攻 Budew 用 Itchy Pollen，对手下回合不能用物品卡。
    - 有 Darkness 能量就贴给 Munkidori，没有就留到第 2 回合。
  turn_2:
    - Dreepy 进化 Drakloak，用 Recon Directive 每只多看 2 张找 Dragapult ex。
    - Crispin 找 Fire + Psychic：一张贴在要进化的 Drakloak 上，一张拿到手里。
    - 放 Meowth ex 用 Last-Ditch Catch 找支援者（多为 Lillie's Determination 或 Crispin）。
  turn_3:
    - 进化 Dragapult ex，补第 2 个能量，开始 Phantom Dive。
    - 落后时 Rosa's Encouragement 从弃牌区给 Dragapult ex 贴 2 个基本能量，下一只马上能打。
  key_cards: [Dreepy, Drakloak, Dragapult ex, Crispin, Buddy-Buddy Poffin, Poké Pad]

attackers:
  - card: Dragapult ex
    printing: TWM 130
    role: main
    prizes: 2
    attack: Phantom Dive
    cost: Fire + Psychic
    damage: 战斗场 200，后备区任意分配 6 个伤害指示物
    notes: 太晶宝可梦，没有弱点；后备区受到的伤害指示物是"放置"，不是伤害，后备区保护类效果另看（见 matchups）。
  - card: Moltres
    printing: PFL 14
    role: tech
    prizes: 1
    attack: Fighting Wings
    cost: Fire
    damage: 20，对战斗场的宝可梦 ex 为 110
    notes: 57% 的卡表有。只给 1 张奖赏卡，用来换掉对方的 2 奖宝可梦或补最后一刀。
  - card: Munkidori
    printing: TWM 95
    role: support-damage
    prizes: 1
    attack: Adrena-Brain（特性）
    cost: 身上有 Darkness 能量即可
    damage: 每回合从自己任一宝可梦挪 3 个伤害指示物到对手任一宝可梦
    notes: 几乎每份卡表 2 张。挪 Risky Ruins 放在自己 Budew/Dreepy 身上的指示物最划算。

support:
  - card: Drakloak
    role: Recon Directive 每回合看 2 拿 1，是这套牌的检索引擎
    prizes: 1
  - card: Budew
    role: 后攻首回合锁物品
    prizes: 1
  - card: Fezandipiti ex
    role: 自己的宝可梦被击倒后抽 3
    prizes: 2
  - card: Meowth ex
    role: 上场时找 1 张支援者；Team Rocket's Watchtower 在场时特性无效
    prizes: 2
  - card: Dudunsparce
    role: 56% 的卡表有，抽 3 后自己洗回牌库，不留奖赏卡
    prizes: 1

prize_map:
  liability: >-
    主攻 Dragapult ex 给 2 张，Fezandipiti ex、Meowth ex 也各给 2 张。
    对手最快的路线是击倒 3 只 2 奖宝可梦；所以 Fezandipiti ex 和 Meowth ex 用完就别留在
    后备区当靶子，Dreepy/Drakloak 被狙也会白送 1 张。
  routes:
    - name: 对 2 奖 ex 卡组（默认）
      steps:
        - {turn: 3, take: 2, target: 后备区 2 只剩余 HP 30 以下的进化前宝可梦, how: 200 打战斗场，同时用 6 个指示物各放 3 个收两只（例如 Risky Ruins 后的 50 HP Abra）；做不到就 200 + Munkidori 30 击倒 230 HP 以内的 ex}
        - {turn: 4, take: 2, target: 2 奖 ex, how: 前一回合的 60 指示物 + 200 + Munkidori 30 = 290，可击倒 Mega Kangaskhan ex 以外的大部分 ex}
        - {turn: 5, take: 2, target: Boss's Orders 拉出来的 2 奖 ex, how: 收尾；对手剩 3 张以下时先用 Special Red Card 打乱对手手牌}
    - name: 对单奖卡组（Festival Lead、Alakazam、Dhelmise 等）
      steps:
        - {turn: 3, take: 2, target: 战斗场 + 后备区 1 只小怪, how: 200 打战斗场，60 指示物收掉后备区 60 HP 以下的一只}
        - {turn: 4, take: 2, target: 同上, how: 同上；Munkidori 补伤害}
        - {turn: 5, take: 2, target: 同上, how: 对手后备区补不出新小怪时就只能一回合拿 1 张，节奏会慢一回合}

matchups:
  - vs: crustle-dri
    win_rate: 0.272
    plan: >-
      最差对局。Crustle 的 Mysterious Rock Inn 让 ex 的招式伤害无效，Dragapult ex 只能靠 Phantom Dive 的
      后备区指示物、Munkidori 和 Moltres（非 ex，火属性，Crustle 弱火，打 40）。对方 Mist Energy 还会挡住招式效果，
      指示物放不上去。打法是攒指示物慢慢磨，同时用 Crushing Hammer 拆对方能量。
  - vs: slowking-scr
    win_rate: 0.391
    plan: 对方 Slowking 只给 1 张，还能用 Kyurem 一次打 3 只 110。别把 Dreepy 一次全铺出来。
  - vs: dhelmise-pbl
    win_rate: 0.414
    plan: >-
      对方大部分宝可梦有 Hide 'n' Sneak，Phantom Dive 的指示物放不上去，Lillie's Clefairy ex 还会让 Dragapult
      弱超能。优先击倒 Lillie's Clefairy ex（2 奖），再用 200 打 Dhelmise（140 HP）。
  - vs: n-zoroark
    win_rate: 0.434
    plan: N's Zoroark ex 280 HP，要先在后备区放 60 指示物，再 200 + 30 击倒。对方 Watchtower 会关掉 Meowth ex。
  - vs: basic-box-m
    win_rate: 0.441
    plan: 对方 Lillie's Clefairy ex 让 Dragapult 弱超能，先用指示物和 Boss 处理它；Mega Kangaskhan ex 给 3 张，留到最后一击。
  - vs: dragapult-dusknoir
    win_rate: 0.583
    plan: 准镜像。对方 Dusclops/Dusknoir 自爆会送你奖赏卡，数清楚再决定是否先手抢节奏。
  - vs: alakazam-dudunsparce
    win_rate: 0.633
    plan: >-
      关键是场地卡之争：对方 Battle Cage 在场时 Phantom Dive 的后备区指示物完全放不上，必须先用 Risky Ruins 换掉它，
      所以 2 张 Risky Ruins 和找到它的抽牌都要留着。Drakloak 的 Dragon Headbutt（70）第 2 回合就能先手击倒 Abra。
      对方的 Fezandipiti ex 打残不打死（不给它 Flip the Script 抽 3），同时让自己保持落后，Rosa's Encouragement 才能用；
      之后一发 Phantom Dive 同时收掉战斗场 Alakazam 和预先打残的后备区宝可梦。对方 Genesect 带道具会封住 Unfair Stamp。
      对方手牌到 16 张就能一击 Dragapult ex（320），别指望它撑两回合。

evidence:
  - source: video-reviews/worlds2026-masters-final-game1.md（项目共享文件夹）
    game: 2026 世界赛 Masters 决赛第 1 局，Hedrick（Dragapult ex）胜 Cassiraga（Alakazam），6 奖对 5 奖
    window: TEF-PBL
    confirms:
      - Battle Cage 挡住后备区指示物，Risky Ruins 换场地是这个对局的转折（https://www.youtube.com/watch?v=KQ-32rHXKM8&t=1201s、https://www.youtube.com/watch?v=KQ-32rHXKM8&t=1706s）
      - Drakloak 第 2 回合用 Dragon Headbutt 先手击倒 Abra（https://www.youtube.com/watch?v=KQ-32rHXKM8&t=438s）
      - 一回合 Phantom Dive 拿 3 奖：击倒 Alakazam + 1 个指示物收掉残血 Fezandipiti ex（https://www.youtube.com/watch?v=KQ-32rHXKM8&t=1201s）
    adds:
      - 故意把对方 Fezandipiti ex 打到 10 HP 不击倒，拒绝 Flip the Script 并保持落后以便用 Rosa's Encouragement（https://www.youtube.com/watch?v=KQ-32rHXKM8&t=840s）
      - 对方手牌 16 张，Powerful Hand 一击满血 Dragapult ex（https://www.youtube.com/watch?v=KQ-32rHXKM8&t=1051s）
    caveat: 26:50 那次 Boss's Orders 是复盘根据前后画面推断的；这是一局，不代表胜率。
  - source: video-reviews/brisbane-2026-brentymon-dragapult.md（项目共享文件夹）
    game: Brisbane 区域赛（2026-09-26）BrentyMon（Dragapult ex，第 3 名）第 10 轮 2-1 胜 Marcus Ibbotson（Alakazam），四强 0-2 负 Edmund Khoo（Dragapult ex 镜像，冠军）
    window: TEF-30C
    confirms:
      - 对 Alakazam：过早打 Risky Ruins 被 Battle Cage 换回，差点被翻盘（https://www.youtube.com/watch?v=KfJk7KymeYI&t=3000s）
      - 对 Alakazam：找到第二张 Risky Ruins 后一回合拿 2 张收尾（https://www.youtube.com/watch?v=KfJk7KymeYI&t=3170s）
    adds:
      - 对 Alakazam 后攻吃亏（选手判断），他第 2 局认输换第 3 局先攻
      - Risky Ruins 后 Phantom Dive 的指示物按对手进化后的 HP 分配（https://www.youtube.com/watch?v=KfJk7KymeYI&t=4090s）
      - 镜像：先保住自己能用物品，再想用 Budew 锁对手（https://www.youtube.com/watch?v=KfJk7KymeYI&t=4740s）
      - 镜像：扣住 Munkidori 和 Darkness 诱对手多放伤害（https://www.youtube.com/watch?v=KfJk7KymeYI&t=5370s）
      - 镜像：对手只差 1 张时用 Fezandipiti ex 接 Unfair Stamp 翻盘（https://www.youtube.com/watch?v=KfJk7KymeYI&t=5860s）
    caveat: 区域赛直播是俯拍桌面，没有侧边数据面板；击倒了谁多半根据选手解说推断。
  - source: video-reviews/worlds2026-masters-top-cut.md（项目共享文件夹）
    game: 2026 世界赛 Masters 四强，Hedrick 2-0 Tonisson（Dragapult ex 镜像，双方都带 4 张 Crushing Hammer）
    window: TEF-PBL
    confirms:
      - 镜像：Munkidori 的 Darkness 能量是 Crushing Hammer 的首要目标
      - Boss's Orders + Phantom Dive 一回合拿 3 张（https://www.youtube.com/watch?v=R4d7ll0oz1Q&t=1770s）
    adds:
      - 镜像：Judge 把自己也打乱，第 1 局 Tonisson 打完自己没抽到要的牌
      - 镜像：被 Mind Bend 混乱时撤到 Budew，不赌硬币
      - 镜像：Hammer 互拆后，落后方用 Rosa's Encouragement 从弃牌区贴回 2 个能量
      - 镜像：Phantom Dive 故意不击倒，下回合 Hammer 加 Phantom Dive 一回合拿 3 张（https://www.youtube.com/watch?v=R4d7ll0oz1Q&t=3045s）
      - 构筑：Hedrick 9 个能量含 3 张 Darkness，解说认为这是 Hammer 互拆的镜像里的差别
    caveat: 一场两局；拿奖读数和解说对得上，"故意不击倒"的理由是推断的。
  - source: video-reviews/worlds2026-masters-top-cut.md（项目共享文件夹）
    game: 2026 世界赛 Masters 八强，Tonisson 2-0 Spry（Basic Box，带 Prime Catcher、Enamorus、Jamming Tower，没有 Hero's Cape 和 Unfair Stamp）
    window: TEF-PBL
    confirms:
      - 对 Basic Box：Wellspring Ogerpon 的 Torrential Pump 一次收掉两只 Drakloak（第 2 局）
      - 对 Basic Box：对手要连续三次正面才能用 Kangaskhan 一击 Dragapult ex，第 1 局第一次就抛出反面
    adds:
      - 对 Basic Box：Moltres 先打 Kangaskhan 110，对手击倒 Moltres 后，同一回合 Rosa's Encouragement + Unfair Stamp + Phantom Dive 击倒 Kangaskhan 拿 3 张（https://www.youtube.com/watch?v=qwBID2ApsOY&t=29681s）
      - 对 Basic Box：Moltres 打弱火的 Iron Leaves ex 是 220，一击（第 2 局）
      - 对 Basic Box：Boss's Orders + Special Red Card + Phantom Dive 几回合拿 5 张（https://www.youtube.com/watch?v=qwBID2ApsOY&t=30687s）
    caveat: 一场两局；第 2 局那 5 张的顺序没有逐回合核对。
  - source: video-reviews/indianapolis-2026.md（项目共享文件夹）
    game: Indianapolis 2026 区域赛八强，Sakadjian（本卡组，多 2 张 Watchtower，9 个能量）0-2 Reddy（Crustle）
    window: TEF-POR
    confirms:
      - 对 Crustle：ex 打不动 Crustle，只能靠 Crushing Hammer 和 Munkidori；Watchtower 关掉对手 Kangaskhan 的 Run Errand（第 1 局，对手唯一的场地在奖赏卡里）
    adds:
      - 对 Crustle：对手把 Hero's Cape 挂在 Crustle 上（290），Jumbo Ice Cream 每回合回 80，打不穿；4 次 Crushing Hammer 都是反面（第 1 局）
      - 对 Crustle：手里的 Unfair Stamp 被 Eri 弃掉（第 2 局）
    caveat: 一场两局；时间按解说（https://www.youtube.com/watch?v=rFR1ZVFc5ic）。
  - source: video-reviews/turin-2026.md（项目共享文件夹）
    game: Turin 2026 特别赛八强，Vicêncio（本卡组，3 张 Crushing Hammer、Judge、Unfair Stamp、Special Red Card、2 张 Watchtower、Risky Ruins）1-2 Kamerman（Slowking）
    window: TEF-CRI
    confirms:
      - 对 Slowking：Boss's Orders 收掉唯一的 Slowking；Unfair Stamp 加 Watchtower 让对手只能盲翻 Seek Inspiration（第 1 局）
    adds:
      - 对 Slowking：对手战斗场的 Slowpoke 挂 Lucky Helmet，Itchy Pollen 每次让对手抽 2 张（第 2 局）
      - 对 Slowking：后备区少放 Dreepy 挡不住 Trifrost 打战斗场，起手的 Meowth ex 和后备区的 Drakloak、Dreepy 一起吃（第 3 局）
      - 对 Slowking：唯一的 Slowking 被收掉后，对手的 Lillie's Clefairy ex 自己用 Full Moon Rondo 击倒 Dragapult ex（第 1 局）
    caveat: 一场三局（https://www.youtube.com/watch?v=WuXEbywON7g&t=10274s）。

mistakes:
  - 对 Battle Cage 卡组时过早打掉 Risky Ruins，关键回合没有场地可换。
  - 第 2 回合只有 1 只 Drakloak，第 3 回合进化不出 Dragapult ex。
  - Phantom Dive 的 6 个指示物没有对准下回合能击倒的目标，平均撒开。
  - 主动铺出 Fezandipiti ex / Meowth ex 却没用到特性，白给 2 奖靶子。
  - 对 Crustle、Dhelmise 仍然只用 Dragapult ex 正面打。
  - 以为手里有 Night Stretcher 就先进化、硬上攻击，结果没有（Brisbane 第 10 轮第 2 局）。

inferred:
  - 第 3 回合起攻的节奏是按进化规则和卡表推的，不是从对局记录统计的。
  - 对 Crustle 时 Mist Energy 挡住指示物放置，是按卡牌文字推断的规则判断。
  - Moltres 和 Crushing Hammer 的用途是按卡牌效果推断的。
