deck: alakazam-dusknoir
general:
  - text: "第 1 回合就用 Poffin / Telepathic Psychic Energy 摆好 Abra、Duskull：Rare Candy 不能用在当回合才放上的基础宝可梦"
  - text: "攻击前先打完让手牌净增加的牌（Dawn、Hilda、进化抽牌），再决定要不要打 Poffin、Rare Candy + Dusknoir 这类减手牌的"
  - text: "每次 Cursed Blast 送对手 1 张：只用来击倒 2 奖以上、配合 Powerful Hand 一回合两次击倒，或拆关键引擎"
  - text: "整副只有 5 个能量，Telepathic 捡不回来：能量在攻击当回合才贴给 Alakazam，Hilda 留着找能量"
  - text: "默认选后攻：后攻第 1 回合能用 Dawn 拿齐进化线，Budew 锁对手第 2 回合物品"
    inferred: true
matchups:
  dragapult-ex:
    - text: "Dragapult ex 在战斗场时：Dusknoir Cursed Blast 130 + Powerful Hand 10 张（190）= 320 击倒；Dusknoir 只留给它，别换 Dreepy"
    - text: "第 2 回合优先用 Prime Catcher / Boss 拉后备区的 Drakloak 击倒，它是找 Dragapult ex 的引擎"
    - text: "Phantom Dive 6 指示物 + Munkidori 3 个能收 Abra / Duskull / Budew：后备区只放要进化的 Abra 和 Duskull，Abra 尽快进化"
    - text: "Risky Ruins 让后备区基础宝可梦掉 2 个指示物，基础宝可梦要在对方打出它之前（通常第 1 回合）摆好"
    - text: "Fezandipiti ex 放后备区等对方 Unfair Stamp 后抽 3，但别上战斗场（Cruel Arrow / 200 + Munkidori 一击）"
      inferred: true
  n-zoroark:
    - text: "第 2 回合 Dusknoir 的 130 收后备区的 N's Zekrom，拆复制来源；资源只够一样时先 Powerful Hand 打 Zorua"
    - text: "对方带 Special Red Card：拿到第 2 张后先停手只打伤，把两只 Zoroark ex 都打进击倒范围，再一回合拿 4 张"
      judgment: akd-zor-01
    - text: "我方全体弱恶、挨一下就倒：每回合优先击倒对方下回合能攻击的那只 Zoroark（Rampaging Thunder 后不能连打）"
    - text: "对方 Judge / Xerosic 打手牌时把 Dusknoir 提前放在场上，Cursed Blast 不需要手牌"
    - text: "别以为 Dusknoir 160 扛得住：中毒 + Binding Mochi 的 Shred 是 220；Fezandipiti ex 别上战斗场"
  dragapult-dusknoir:
    - text: "对方 Dusknoir 130 + Phantom Dive 60 = 190 收后备区 Alakazam：第二只 Alakazam 在攻击当回合再 Rare Candy 进化"
    - text: "只在 Stamp 之后还接得上时才收对方 Budew（场上已有 Dusclops 或 Dusknoir、Fezandipiti ex 在后备区），否则下回合吃 Unfair Stamp"
      judgment: akd-dpx-01
    - text: "手牌不够一击 Dragapult ex 时先打伤不击倒，下回合 Cursed Blast 收掉，对方这回合没 Stamp 可打"
      inferred: true
    - text: "落后、Alakazam 线断时：Prime Catcher 拉对方没能量的 Fez，Teleporter Abra 抵消换位，Shadow Bind 锁住"
    - text: "收尾时算 Cursed Blast 次数：对手剩 3 张最多自爆 2 次；落后时可用自爆拖成同时拿完进入突然死亡"
  basic-box-m:
    - text: "对方几乎全是 2 奖 ex，我方只需 3 次击倒：Powerful Hand 打战斗场 ex（210 要 11 张，170 Meowth ex 要 9 张）"
    - text: "不攻击也能拿 2 张：Dusknoir 130 + Dusclops 50 = 180 直接击倒后备区的 Meowth ex"
    - text: "对方 Mega Kangaskhan ex 在战斗场时 15 张或 Dusknoir + 9 张拿 3 张；凑不够别硬凑，改打 2 奖 ex"
    - text: "Fezandipiti ex 别放战斗场被 200 一击；也别打对方 1 奖的 Chien-Pao、Enamorus 浪费回合"
  slowking-scr:
    - text: "第 1 回合就放 Shaymin 到后备区，挡 Trifrost 和 Cruel Arrow 打后备区；Fezandipiti ex 别放后备区（Zeraora 210）"
    - text: "Slowking 120 只要 6 张手牌；别用 Dusknoir 打它，白送奖赏卡"
    - text: "对方 Mega Kangaskhan ex 上战斗场 Run Errand 时，15 张或 Dusknoir + 9 张拿 3 张；否则 Boss 拉 Latias ex 拿 2 张"
    - text: "Ghostly Blow 的 5 个指示物 Shaymin 挡不住，能收后备区 Abra，Abra 尽快进化"
  alakazam-dudunsparce:
    - text: "Battle Cage 在场时 Cursed Blast 只能打战斗场：先击倒 130 以内的战斗场，再 Powerful Hand 打新上来的"
    - text: "战斗场是满血 Alakazam（140）时别直接 Cursed Blast，先 Boss 拉 130 HP 以内的后备区宝可梦上来"
    - text: "Special Red Card 留到对方拿到第 3 张奖赏卡后那回合打，对方下回合多半凑不够 7 张"
      inferred: true
    - text: "对方 Psyduck 在场时 Cursed Blast 无效，先 Powerful Hand 4 张打掉它；Genesect 带道具时 Boss 是唯一拉人手段"
    - text: "Eri 会弃物品、Enhanced Hammer 拆特殊能量：能用的物品早用，留 1 张 Psychic Energy 给关键回合"
  mega-excadrill-ex:
    - text: "Mega Excadrill ex 在战斗场：Dusknoir 130 + Powerful Hand 11 张 = 350 击倒拿 3 张；两只 Mega 就是 6 张"
    - text: "第 1 回合放 Shaymin 挡 Sonic Ripper 220 打后备区"
    - text: "Dusknoir 单独击倒后备区 Metang（100）断能量，打掉一只就够，然后转向 Mega"
    - text: "带 Hero's Cape（440）撑过一回合时，下回合优先补刀同一只，别分散伤害（Jumbo Ice Cream 回 80）"
  dragapult-blaziken:
    - text: "对方只有 2 只 Torchic：第 2 回合 Powerful Hand 打 Torchic，后备区的用 Boss / Prime Catcher 拉出来"
    - text: "第 3 回合 Dusknoir 单独击倒后备区 Combusken（100）或 Drakloak（90）；Dragapult ex 已在前就 Dusknoir + 10 张"
    - text: "用自爆把对手送进 3 张以内前，先数自己场上有几只 Abra / Budew 能被一次 Phantom Dive 收掉"
    - text: "后攻 Budew 锁物品，对方第 2 回合用不了 Rare Candy，Blaziken ex 上不来"
      inferred: true
  festival-lead:
    - text: "先清带 Festival Lead 特性的 Dipplin、Goldeen、Seaking 和会进化成 Dipplin 的 Applin，对方一回合只能攻击一次"
      judgment: akd-fes-01
    - text: "每回合用 Cursed Blast 收一只后备区宝可梦再 Powerful Hand 打战斗场：对方后备区 3 只时 Do the Wave 打不倒 Alakazam"
      inferred: true
    - text: "有 Dusknoir 时 Cursed Blast 先击倒后备区 Thwackey（100），它是对方检索引擎"
    - text: "用 Cursed Blast 前算对方会不会因此降到 3 张，是的话同一回合就能打 Special Red Card"
    - text: "对方 Psyduck 在场时别进化 Dusknoir，先 Boss 拉 Psyduck 用 4 张击倒；对方手牌剩 1 张防 Gladion 两次击倒"
  dhelmise-pbl:
    - text: "Hide 'n' Sneak 同时挡 Powerful Hand 和 Cursed Blast：只打 Dhelmise 和 2 奖 ex，别对着它们出招"
    - text: "Prime Catcher 和 Boss 留给 Dhelmise 和 2 奖 ex；战斗场是 Hide 'n' Sneak 墙时拉后备区 Dhelmise 出来打"
    - text: "第 3 回合 Cursed Blast 130 打后备区 Dhelmise，再 Boss 拉出来 Powerful Hand 1 张补刀"
    - text: "Matcha Spin 全场 40：后备区别放 Budew 这类小怪，宝可梦尽快进化到 Alakazam 或 Dusclops"
  ogerpon-meganium-hydrapple:
    - text: "Meganium 一上场就处理：Dusknoir 130 + Dusclops 50 = 180 不攻击击倒后备区 Meganium，或 Boss + 8 张"
    - text: "Fezandipiti ex 起手时第 1 回合用 Dawn / Poffin 铺基础宝可梦，别用 Hilda，否则 Fez 被一击直接输"
    - text: "优先打 Ogerpon ex（11 张或 Dusknoir + 4 张），别花 17 张打 Hydrapple ex，也别分两回合打它（回 30）"
    - text: "我方剩 2 张时记得 Briar：对方 Ogerpon ex 击倒战斗场就拿 2 张"
    - text: "Budew 锁不住 Forest of Vitality；Judge / Stamp 打手牌时把 Dusknoir 提前放场上，130 + 10 张够击倒 Hydrapple ex"
      inferred: true
  crustle-dri:
    - text: "最现实的路线是两只 Mega Kangaskhan ex：在战斗场 Run Errand 时 Dusknoir 130 + Powerful Hand 9 张击倒拿 3 张"
      inferred: true
    - text: "Kangaskhan 贴 Mist 时 Powerful Hand 打不进，再挂 Hero's Cape 是 400，三次 Cursed Blast 也打不倒，别追"
    - text: "别和贴 Mist Energy 的 Crustle 拼消耗，也别用两次自爆换 1 张 Crustle；资源留着等 Kangaskhan"
    - text: "Xerosic / Eri 砍手牌：Dusknoir 提前进化好，能用的牌先用掉，Kangaskhan 一上战斗场就 Cursed Blast"
    - text: "对方会先击倒带能量的宝可梦再拉没能量的 Duskull 困住：注意 5 个能量的分布"
  alakazam-dusknoir:
    - text: "镜像选后攻：后攻第 1 回合 Dawn 拿齐进化线，Budew 先锁对方物品"
      judgment: akd-mir-01
    - text: "前两回合用 Dusclops 的 Cursed Blast 或 Kadabra 打掉对方 Budew，谁先解锁谁先进化"
    - text: "Fez 是唯一的 2 奖目标：对方剩 3 张以下时拉出 Fez + Special Red Card + Powerful Hand 拿 2 张"
    - text: "尽量别让 Fezandipiti ex 起手留在战斗场，撤退要 1 个能量，留前场就是送 2 奖"
      judgment: akd-mir-02
    - text: "领先时拿最后几张前清光对方 Abra 线、数对方能自爆的 Dusclops / Dusknoir，防被拖成同时拿完"
      inferred: true
