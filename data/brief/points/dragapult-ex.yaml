deck: dragapult-ex
general:
  - text: "Dragapult ex 最早自己第 3 回合才能 Phantom Dive；后攻第 1 回合可用 Budew 的 Itchy Pollen 锁对手下回合物品"
  - text: "指示物不是伤害：穿过太晶保护、Shaymin、Mysterious Rock Inn；对 Hide 'n' Sneak、Mist Energy、Rabsca、Battle Cage 无效"
  - text: "Munkidori 要有 Darkness 能量才能挪指示物，多数卡表只带 2 个，Crispin 可以找，先保它的能量"
  - text: "Risky Ruins 让非恶基础宝可梦放上后备区掉 20 并带到进化型：先打它削对手，但自己的 Dreepy 也会吃"
  - text: "Meowth ex、Fezandipiti ex 各给 2 张：用完特性别留后备区当靶子"
matchups:
  n-zoroark:
    - text: "第一发 Phantom Dive 打不死 280 的 Zoroark ex：6 个指示物 + Munkidori 30 集中铺在一只 Zoroark / Zorua 上，下回合收"
      inferred: true
    - text: "对手后备区有 N's Reshiram 时别留一只吃过 200 还活着的 Zoroark ex，复制 Powerful Rage 打 400；改 Boss 拉 Reshiram 击倒"
      inferred: true
    - text: "先击倒 Pecharunt ex 和对手 Munkidori：少一块加成对手 250 + 剩下一块最多 290，一击不了 Dragapult ex"
      inferred: true
    - text: "Watchtower 落地前用掉 Meowth ex；已在场时先打 Risky Ruins 换掉再放 Meowth ex"
    - text: "对手 Munkidori 有 Darkness 且有指示物可挪时，Budew（30）放前场锁物品要和送 1 张比一比"
      inferred: true
  basic-box-m:
    - text: "Lillie's Clefairy ex 一落地就 Boss 掉：它在场时 Latias ex 400 一击 Dragapult ex"
    - text: "Clefairy 挂了 Hero's Cape（290）时 Boss + 200 打不倒：用 Crushing Hammer 拆它唯一的 Psychic，或 Cruel Arrow + Munkidori 先磨"
    - text: "先打 Risky Ruins，后备区 Meowth ex 吃 20 + 两回合 60 + Munkidori 30 正好 170 收掉"
      inferred: true
    - text: "对手 Kangaskhan 在前：Moltres 先打 110，下回合 Phantom Dive 200 收它拿 3 张；用单奖换对手 2 奖、3 奖比抢第一张划算"
    - text: "对手的 Fezandipiti ex 会用 Cruel Arrow 逐只收 Dreepy / Drakloak：后备区至少留 2 只进化线，Night Stretcher 留着补"
  dragapult-dusknoir:
    - text: "第一发 Phantom Dive 的指示物先收后备区 Duskull，断 Dusknoir；其次 Patrat，再其次 Dusclops"
      inferred: true
    - text: "对手 Dragapult ex 在后备区时先放 60，下回合 Boss 出来 200 + 两只 Munkidori 60 正好 320"
      inferred: true
    - text: "先攻第 1 回合就用 Poffin 把 Budew 和 Dreepy 一起放上场，第 2 回合 Itchy Pollen 锁对手的 Rare Candy"
      judgment: dpx-dpd-01
    - text: "对手可能握 Unfair Stamp、后备区有 Fez 时，Phantom Dive 先不击倒，分指示物到下一发能收两只的位置；对手 Munkidori 有 Darkness 时不这样打"
      judgment: dpx-dpd-02
    - text: "Meowth ex / Fezandipiti ex 别留后备区：Dusknoir 130 + Phantom Dive 60 收 Meowth ex，加 Munkidori 30 收 Fez"
  alakazam-dudunsparce:
    - text: "Risky Ruins 至少留 1 张到对手打出 Battle Cage 后再换，Ruins 下的 Abra 剩 30 收两只；没场地可换就 Boss 拉到战斗场打"
    - text: "这个对局后攻吃亏：对手先攻打出 6-4 的奖赏差后很难追"
      judgment: dpx-adu-01
    - text: "Fezandipiti ex 打到剩 10 不击倒：对手抽不了 3，我们也保持落后能用 Rosa；最后一回合再收它 2 张"
      inferred: true
    - text: "对手 Genesect 挂道具时 Unfair Stamp 被封，手牌干扰改靠 Judge / Special Red Card；对手场上有 Dunsparce 时别打 Judge"
    - text: "对手牌库薄、战斗场挂 Lucky Helmet 时用小招式反复打、Boss 拉回，打牌库耗尽"
      judgment: dpx-adu-02
  slowking-scr:
    - text: "Slowking 是超能属性：Lillie's Clefairy ex 在场时复制来的 Metallic Hammer 是 600，先 Boss 掉 Clefairy；暂时没 Boss 用 1 奖挡"
    - text: "复制来的 Metallic Hammer 是 300 不是 150：没 Clefairy 时满血 Dragapult ex 吃一下剩 20"
    - text: "后备区只放 2-3 只进化线：Trifrost 一次打 3 只各 110，铺满会被一次收 2 张"
      inferred: true
    - text: "对手刚用 Ciphermaniac's / Academy 叠好牌库顶，下个回合打 Judge 洗乱"
      inferred: true
    - text: "对手后备区有 Fez 时可先铺指示物不击倒，等 Kangaskhan / Latias ex 进范围一回合收多张，数字要先算清"
  dragapult-blaziken:
    - text: "Phantom Dive 的指示物优先收后备区 Torchic（吃过 Ruins 剩 50，5 个），别让它活到能 Rare Candy 的回合"
      inferred: true
    - text: "Boss 对手的 2 阶 ex 前一回合先在它身上放 60：200 + 60 + 两只 Munkidori 60 = 320"
      inferred: true
    - text: "Seething Spirit 每回合补 1 个能量，别指望 Crushing Hammer 锁住对手"
      inferred: true
    - text: "Chi-Yu 的 Ground Melter 会拆 Risky Ruins；后备区别留 Meowth ex / Fezandipiti ex"
  mega-excadrill-ex:
    - text: "Moltres 留手，等 Mega Excadrill ex 站到战斗场再放：220 + 前回合 60 + 两只 Munkidori 60 = 340 一击拿 3 张"
      inferred: true
    - text: "用 Crushing Hammer 把 Excadrill 压在 4 个能量以下，它只能打 200，Dragapult ex 还能再打一次"
      inferred: true
    - text: "Phantom Dive 的指示物打引擎：吃过 Ruins 的 Drilbur / Beldum 5 个一只，Metang 60 + Munkidori 30"
      inferred: true
    - text: "Mega Skarmory ex 弱雷不弱火，别用 Moltres 打（只有 110）：Phantom Dive 200 + 前回合 60 收它"
    - text: "Sonic Ripper 220 打后备区：Meowth ex / Fezandipiti ex 别放后备区，Moltres 也别早放"
  crustle-dri:
    - text: "Dragapult ex 打不进 Crustle：Phantom Dive 把 6 个指示物放后备区没挂 Mist 的 Crustle，加两只 Munkidori 6 个，两回合一只"
      inferred: true
    - text: "对手 Mega Kangaskhan ex 一站到战斗场就收：200 + 前回合 60 + Munkidori 30 + Ruins 20 = 310 拿 3 张"
      inferred: true
    - text: "早期用 Crushing Hammer 拆 Crustle 能量（Superb Scissors 要 3 个，拆到 2 个 Jumbo Ice Cream 也用不了）"
      inferred: true
    - text: "后备区多放两只贴 Darkness 的 Munkidori 当主输出，不放 Meowth ex、Fezandipiti ex"
    - text: "挂 Mist Energy 的 Crustle 放不上 Phantom Dive 指示物，但 Munkidori 的 Adrena-Brain 是特性能挪上去"
  festival-lead:
    - text: "保持 Risky Ruins 在场换掉 Festival Grounds，Dipplin 只能打一次；对手 4 张 Grounds，准备第二张 Ruins"
    - text: "Rabsca 在场时后备区指示物放不上：先用两只 Munkidori 挪 6 个收它（吃过 Ruins 剩 50），或 Boss 拉出来 200 击倒"
    - text: "每回合收后备区让对手后备区不到 5 只：4 只时 Bangle + Kieran 是 140×2 = 280 打不死"
    - text: "Gladion 用完也不安全：Kieran 还在且后备区 5 只时 Brave Bangle 仍是 160×2 = 320 一击 Dragapult ex"
  dhelmise-pbl:
    - text: "优先 Boss 拉 Lillie's Clefairy ex，Phantom Dive 200 击倒：它在场时 Vengeful Anchor 340 一击 Dragapult ex"
      inferred: true
    - text: "每回合 200 击倒战斗场 Dhelmise，6 个指示物放在后备区下一只 Dhelmise 上，别往 Hide 'n' Sneak 宝可梦上放"
      inferred: true
    - text: "2 奖目标一出现就收：全靠 Dhelmise 要击倒 6 次，被 Legacy Energy 吃 1 张就是 7 次"
      inferred: true
    - text: "Patrat 会关掉 Munkidori，先用 Phantom Dive 收掉；Budew 和吃过 Ruins 的 Dreepy 会被 Matcha Spin 一次收"
  ogerpon-meganium-hydrapple:
    - text: "Meganium 一上场就收，比 Teal Mask Ogerpon ex 优先：它和 Hydrapple ex 同时在场后 Syrup Storm 能打 390"
      judgment: dpx-omh-01
    - text: "先打 Risky Ruins 顶掉 Forest of Vitality，6 个指示物收后备区 Chikorita / Applin，断进化线"
      inferred: true
    - text: "Teal Mask Ogerpon ex 用 Moltres 打 220 正好一击，别用 Dragapult ex 多冒 2 奖风险"
    - text: "我们剩 2 张时别让 Dragapult ex 留在战斗场，对手 Briar 加 Ogerpon ex 击倒会拿 3 张"
      inferred: true
    - text: "我们击倒一只后，对手下回合可能打 Unfair Stamp 把我们手牌打到 2 张"
  alakazam-dusknoir:
    - text: "对手没有 Battle Cage：每发 Phantom Dive 战斗场 1 只 + 后备区吃过 Ruins 的 Abra / Duskull，6 个通常收 2 只"
      inferred: true
    - text: "先收 Duskull 断 Dusknoir：Cursed Blast 130 + Powerful Hand 10 张手牌就够一击 Dragapult ex"
      inferred: true
    - text: "对手还留着 Prime Catcher 时，没能量的 2 奖 ex 别留后备区，会被拉上来 Shadow Bind 锁住"
      inferred: true
    - text: "同时铺两到三只 Dreepy，别只养一只 Drakloak，被单独打掉就打不出 Phantom Dive"
      inferred: true
    - text: "别把 Budew 之争当主线：对手 Dusclops 自爆 50 正好击倒 Budew"
  dragapult-ex:
    - text: "Budew 互锁物品时先保住自己能用物品，再想锁对手"
      judgment: dpx-mir-01
    - text: "第一次拿奖选在能用 Itchy Pollen 击倒对方 Budew 那回合：拿 1 张、解开自己的锁、还锁住对方，对方打不出 Unfair Stamp"
      judgment: dpx-mir-03
    - text: "对手 Munkidori 有 Darkness 时，没击倒目标别 Phantom Dive 撒指示物，先用 Jet Headbutt 或 Itchy Pollen 拖"
      judgment: dpx-mir-02
    - text: "Crushing Hammer 先拆对手 Munkidori 的 Darkness；等能一次收两只再出手，Unfair Stamp 留到对手只差 1-2 张"
    - text: "Judge 会把自己也打乱：只在对手被锁物品、自己手牌差对手手牌好时打"
      inferred: true
